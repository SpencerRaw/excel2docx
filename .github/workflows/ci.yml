name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['*.md', 'examples/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Run benchmark
        run: PYTHONPATH=src python -m benchmark.runner --suite casino --json

      - name: Lint
        run: ruff check src/ tests/ benchmark/
