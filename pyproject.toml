[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "excel2docx"
version = "0.1.0"
description = "General-purpose Excel-to-DOCX pipeline: parse structured spreadsheets, transform with rules or LLMs, generate formatted Word reports."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "SpencerRaw"}]
keywords = ["excel", "docx", "report-generation", "llm", "document-automation"]

dependencies = [
    "openpyxl>=3.0",
    "python-docx>=1.0",
    "pyyaml>=6.0",
    "jinja2>=3.0",
]

[project.optional-dependencies]
llm = ["openai>=1.0"]
dev = ["pytest", "pytest-cov", "ruff"]

[project.urls]
Homepage = "https://github.com/SpencerRaw/excel2docx"
Repository = "https://github.com/SpencerRaw/excel2docx"

[project.scripts]
excel2docx = "excel2docx.pipeline:main"
